		function switchTab(_index, _charIndex) {
			$('.char-tab.selected').removeClass('selected');
			$($('.char-tab')[_index ?? 0]).addClass('selected');
			const _container = $('#char-desc-container');
			const _c = _chars[_charIndex ?? 0];
			if(_c)
				switch (_index) {
					case 2:
						{
							let _html = '';
							for (let _item of _c.stats)
								_html += `<div class="char-stat w-100 flex animate__animated animate__fadeIn">
									<div class="stat-title flex w-50 flex-jc-start">
										${_item.title}
									</div>
									<div class="stat-text flex w-50 flex-jc-end">
										${_item.description}
									</div>
								</div>`;
							_container.html(_html);
							break;
						}
					case 1:
						{
							let _html = '';
							for (let _i of _c.skills)
								_html += `<div class="skill-item w-100 flex animate__animated animate__fadeIn">
									<div class="skill-icon-wrapper flex">
										<div class="flex skill-icon">
											<img src="${_i.iconPath}" />
										</div>
									</div>
									<div class="skill-text flex flex-jc-start">

										<div class="skill-desc flex w-100 flex-jc-start">${_i.description}</div>

								</div>`;
							_container.html(_html);
							break;
						}
					default:
						{
							let _html = '';
							for (let _i of _c.story)
								_html += `<div class="char-p animate__animated animate__fadeIn">
									${_i}</div>`;
							_container.html(_html);
							break;
						}
						break;
				}
		}
		function selectChar(_index) {
			$('.char-nav-item.selected').removeClass('selected');
			$($('.char-nav-item')[_index ?? 0]).addClass('selected');
            const _container = $('#container');
            const _c = _chars[_index ?? 0];
			_container.html(`<div class="character-item-info full">
                    <div class="character-item-info-wrapper full flex portrait animate__animated animate__fadeIn" style="background:${_c.background}">
