    <style>
        .accordion { 
            width: 100%; 
            border-radius: 6px; 
        } 
        .accordion-item { 
            border-bottom: 1px solid #f3f4f505; 
        } 
        .accordion-header { 
            cursor: pointer; 
            padding: 2vh; 
            font-weight: bold; 
            font-size:3.2vh !important;
            line-height: 4vh !important;
            transition: all 0.2s ease; 
            user-select: none; 
            background:#f3f4f500
        } 
        .accordion-header .accordion-header-title {
            color:#f3f4f5dd
        }
        .accordion-content { 
            max-height: 0; 
            overflow: hidden; 
            transition: max-height 0.3s ease; 
        } 
        .accordion-content ul { 
            margin: 0;
            list-style-type: disc;
            list-style-position: inside;
        } 
        .accordion-content li { 
            padding:1vh 2vh;
            color:#9d987f !important
        }
        .content {
            margin-top:calc(70px + 2vh) !important;
            width:80% !important;
            overflow-y:auto !important;
            height: calc(100vh - (70px + 2vh)) !important;
            margin:0 auto;
            padding-bottom: 2vh;
            background:radial-gradient(#ffffff30, #000)
        }
        .accordion-header-title {
            transition: color .3s ease
        }
        .accordion-header-date {
            transition: opacity .3s ease;
            will-change: opacity;
            opacity: .75
        }
        .accordion-content.open + .accordion-header-title, 
        .accordion-header:has(+ .accordion-content.open) .accordion-header-title { 
	        color:var(--selection-color) !important;
        }
        .accordion-content.open + .accordion-header-date, 
        .accordion-header:has(+ .accordion-content.open) .accordion-header-date { 
	        opacity: 1
        }
        .top-menu .menu-item:last-child  {
            background:var(--selection-color)
        }
        .top-menu .menu-item:last-child a  {
            border: 1px solid #A27C16;
            margin: 3px;
            height: calc(100% - 6px);
            min-width: 120px;
            color: #333;
            font-weight: 600
        }
        @media screen and (orientation: portrait) { 
           .content {
                width:100% !important;
                height: calc(100vh - (70px + 2vh)) !important;
                min-height: 0 !important;
            }
            .accordion-header { 
                padding: 3vw 4vw
            } 
            .accordion-header-title { 
                font-size:4vw !important;
                line-height: 5vw !important;
            } 
            .accordion-item {
                padding:1.8vw 3vw !important
            }
            .date {
                font-size: 3vw !important;
                line-height: 5vw !important;
                margin-left:3vw;
            }
            .accordion-content li { 
               line-height: 6vw !important;
               padding:1.2vw 3.6vw !important
            }
            .accordion-content ul { 
                padding: 0 3vw; 
            } 
        }
        ul {
            list-style: none !important;      /* tarayıcının bullet'ını kaldır */
            padding: 0 3vh !important;
            margin: 0 !important
        }

        li {
            position: relative;
            text-indent: 0 !important;
            padding-left: 1.5em !important    /* tüm satırlar için boşluk */
        }

        li::before {
            content: "•";           /* bullet karakteri */
            position: absolute;
            left: 0;
        }

            <script> 
                const headers = document.querySelectorAll(".accordion-header"); 
                headers.forEach(header => { 
                    header.addEventListener("click", () => { 
                        const content = header.nextElementSibling; 
                        const openContent = document.querySelector(".accordion-content[style*='max-height']"); 
                        document.querySelectorAll(".accordion-content").forEach(c => { 
                            if (c !== content) { 
                                c.style.maxHeight = null; 
                                c.classList.remove("open"); 
                            } 
                        }); 
                        if (content.style.maxHeight) { 
                            content.style.maxHeight = null; 
                            content.classList.remove("open"); 
                        } 
                        else { 
                            content.style.maxHeight = content.scrollHeight + "px"; 
                            content.classList.add("open"); 
                        } 
                    }); 
                }); 
                const params = new URLSearchParams(window.location.search);
                let version = params.get("version");
                if(version) {
                    if(!isNaN(Number(version)))
